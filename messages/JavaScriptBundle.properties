es6.import.options.exts.help=Тази опция конфигурира разширения в отчети за импортиране.<br><br>Когато е избрано „Автоматично“, ISR добавя разширения към имената на vue файлове, файлове от проекти с „тип“\: „модул“ в package.json и файлове с разширения .mjs или .cjs.<br><br>Когато е избрано „Винаги“, ISR винаги добавя разширения към имената на файловете.<br><br>Когато „Никога“ е избрано, ISR винаги използва имена на файлове без разширения.
es6.import.options.not.import.help=Тази опция конфигурира точните пътища, които ISR пропуска при автоматично импортиране на символ. Вместо това ISR ще търси алтернативни начини за импортиране на символа. Пътищата трябва да следват правилата на glob шаблона.
es6.import.options.paths=Използвайте псевдоними на пътя\:
es6.import.options.paths.help=Тази опция конфигурира стила на пътищата, използвани в инструкциите за импортиране.<br><br>Ако изберете „Винаги“, ISR винаги използва псевдоними от конфигурацията на webpack, vite или jsconfig.json.<br><br>Когато изберете „Само във файлове извън посочените пътища“, ISR използва относителни пътища за импортиране между файлове, за които е дефиниран псевдоним. Всички други файлове използват съпоставяне на пътеки.<br><br>Ако изберете Никога, псевдонимите никога не се използват.
