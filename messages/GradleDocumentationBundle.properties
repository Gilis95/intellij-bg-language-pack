gradle.documentation.org.gradle.api.Project.apply.plugin.groovy=<p>Добавя поддръжка за изграждане на Groovy проекти. Вижте също <a class\="xref" href\="http\://www.gradle.org/docs/current/userguide/tutorial_groovy_projects.html">Глава 9, <i>Бърз старт на Groovy</i></a>.</p><p>Прилага се автоматично\: java, groovy-base</p>
