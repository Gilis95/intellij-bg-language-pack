gradle.cmd.option.build.cache=Активира кеша за изграждане на Gradle. Gradle ще се опита да използва повторно резултатите от предишни компилации.
gradle.cmd.option.build.file=Посочете файла за компилация.
gradle.cmd.option.configuration.cache=Активира конфигурационния кеш. Gradle ще се опита да използва повторно конфигурацията на компилация от предишни компилации.
gradle.cmd.option.configuration.cache.problems=Конфигурира как се обработват проблемите с конфигурационния кеш (неуспех или предупреждение). По подразбиране е неуспешно.
gradle.cmd.option.configure.on.demand=Конфигурирайте само необходимите проекти. Gradle ще се опита да намали времето за конфигуриране за големи компилации с множество проекти.
gradle.cmd.option.console=Указва вида на конзолния изход за генериране. Стойности: 'plain', 'auto' (по подразбиране), 'rich' или 'verbose'.
gradle.cmd.option.continue=Продължете да изпълнявате задачи след неуспешна задача.
gradle.cmd.option.continuous=Непрекъснатото изграждане ви позволява автоматично да стартирате отново заявените задачи, когато въвеждането на задача се промени.
gradle.cmd.option.daemon=Използва демона Gradle за извършване на изграждането. Стартира демона, ако не работи.
gradle.cmd.option.debug=Влезте в режим на отстраняване на грешки (включително редовно проследяване на стека).
gradle.cmd.option.dependency.verification=Конфигурира режима за проверка на зависимостта (строг, снизходителен или изключен)
gradle.cmd.option.dry.run=Изпълнявайте компилации с деактивирани всички действия на задачите.
gradle.cmd.option.exclude.task=Посочете задача, която да изключите от изпълнение.
gradle.cmd.option.export.keys=Експортира публични ключове, използвани за проверка на зависимости.
gradle.cmd.option.foreground=Стартира демона Gradle в режим на преден план.
gradle.cmd.option.full.stacktrace=Отпечатва пълно (много подробно) трасиране на стека за всички изключения.
gradle.cmd.option.gradle.user.home=Посочете домашната директория на потребителя на Gradle.
gradle.cmd.option.help=Показва помощно съобщение.
gradle.cmd.option.include.build=Включете посочения монтаж в композит.
gradle.cmd.option.info=Задайте нивото на регистриране на информационно.
gradle.cmd.option.init.script=Посочете скрипта за инициализация.
gradle.cmd.option.max.workers=Конфигурирайте броя на паралелните работници, които Gradle може да използва.
gradle.cmd.option.no.build.cache=Деактивира кеша за изграждане на Gradle.
gradle.cmd.option.no.configuration.cache=Деактивира конфигурационния кеш.
gradle.cmd.option.no.configure.on.demand=Деактивира използването на конфигурация при поискване.
gradle.cmd.option.no.daemon=Не използвайте демона Gradle за извършване на изграждането. Понякога помага, ако конфигурирате Gradle винаги да използва демона по подразбиране.
gradle.cmd.option.no.parallel=Деактивира паралелното изпълнение на компилации на проекти.
gradle.cmd.option.no.rebuild=Не изграждайте наново зависимостите на проекта.
