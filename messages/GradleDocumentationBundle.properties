gradle.cmd.option.offline=Извършете изграждането без достъп до мрежови ресурси.
gradle.cmd.option.parallel=Събирайте проекти паралелно. Gradle ще се опита да определи оптималния брой нишки за изпълнение.
gradle.cmd.option.priority=Указва приоритета на планиране за демона Gradle и всички процеси, които изпълнява. Стойности: „нормално“ (по подразбиране) или „ниско“.
gradle.cmd.option.profile=Профилира времето за изпълнение на компилацията и създава отчет в директорията <build_dir>/reports/profile.
gradle.cmd.option.project.cache.dir=Посочете директорията на кеша за конкретен проект. По подразбиране .gradle е в основната директория на проекта.
