gradle.cmd.option.project.prop=Задайте свойство на проекта за скрипта за изграждане (например -Pmyprop\=myvalue).
gradle.cmd.option.quiet=Регистрирайте само грешки.
gradle.cmd.option.refresh.dependencies=Актуализиране на състоянието на зависимост.
gradle.cmd.option.refresh.keys=Актуализирайте публичните ключове, използвани за проверка на зависимостите.
gradle.cmd.option.rerun.tasks=Игнориране на предварително кеширани резултати от задачи.
gradle.cmd.option.scan=Създава сканиране на сглобката. Gradle ще издаде предупреждение, ако плъгинът за сканиране на компилация не е приложен.
gradle.cmd.option.settings.file=Посочете файл moon.
gradle.cmd.option.stacktrace=Отпечатва проследяването на стека за всички изключения.
gradle.cmd.option.status=Показва състоянието на работещи и наскоро спрени Gradle демони.
gradle.cmd.option.stop=Спира демона Gradle, ако работи.
gradle.cmd.option.system.prop=Задайте системно свойство на JVM (например -Dmyprop\=myvalue).
gradle.cmd.option.update.locks=Извършете частична актуализация на заключване на зависимост, позволявайки на преминалите модули да променят версията.
gradle.cmd.option.version=Показва информация за версията.
gradle.cmd.option.warn=Задайте нивото на регистриране на предупреждения.
gradle.cmd.option.warning.mode=Указва режима на генериране на предупреждение. Стойности\: „всички“, „неуспешно“, „обобщение“ (по подразбиране) или „нито едно“.
gradle.cmd.option.watch.fs=Позволява проследяване на промените във файловата система, което позволява повторно използване на данни от файловата система за следващото компилиране.
gradle.cmd.option.write.locks=Запазва разделителната способност на зависимостта за заключени конфигурации, като игнорира съществуваща информация за заключване, ако има такава.
gradle.cmd.option.write.verification.metadata=Генерира контролни суми за зависимости, използвани в проекта (списък, разделен със запетая).
