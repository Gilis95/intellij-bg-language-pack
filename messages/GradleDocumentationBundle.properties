gradle.documentation.org.gradle.api.Project.apply.plugin.eclipse-wtp.non-html=Прави същото като плъгина на eclipse и също генерира конфигурационни файлове на Eclipse WTP (платформа за уеб инструменти). Веднъж импортирани в Eclipse, вашите проекти за война/уши трябва да бъдат конфигурирани да работят с WTP.
