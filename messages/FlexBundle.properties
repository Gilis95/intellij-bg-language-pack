flexmojos.warning.detailed=<html><p>IntelliJ IDEA не може да генерира <b>конфигурационни файлове на Flex компилатор</b> и други спомагателни файлове<br>(target/[project_name]-config-report.xml и target/classes/config-[version]/*.*)</p><br><p>Тези файлове са необходими за правилно открояване на код, автоматично довършване и компилация в проекти на Flexmojos.<br>За да се гарантира че необходимите са актуални файлове, изпълнете следната команда на Maven от командния ред\: </p><pre><b>mvn compile -DconfigurationReport\=true</b></pre></html>
