DotNetDebuggerGeneralConfigurableUi.help.label.de.optimize.methods.assemblies=Дебъгерът конфигурира JIT да прекомпилира методи от външен код, където е вмъкната точка на прекъсване или е настъпило изпълнение стъпка по стъпка. Това подобрява поетапното изпълнение, изчислението и много други функции за отстраняване на грешки, докато се отстраняват грешки във външни източници.
DotNetDebuggerGeneralConfigurableUi.help.label.disable.jit.optimizations=Тази опция предотвратява оптимизирането на всички сборки (системни и двоични връзки), компилирани в режим на издаване, ако процесът е стартиран от програма за отстраняване на грешки. Това забавя процеса, но ви позволява да видите оптимизирани локални променливи в тези сборки.
DotNetDebuggerGeneralConfigurableUi.help.label.use.jit.for.precompiled.assemblies=Ако предварително компилиран образ (NGen, CrossGen или който и да е AOT) е зареден за компилация, JIT няма да работи и деактивирането на JIT оптимизацията няма да има ефект. Тази опция позволява на дебъгера да игнорира предварително компилираното изображение и принуждава JIT да компилира асемблирането. Това забавя процеса на стартиране, но ви позволява да преглеждате оптимизирани локални променливи в сборката (ако JIT оптимизацията е деактивирана).
