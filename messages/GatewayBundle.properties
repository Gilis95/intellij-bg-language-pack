ssh.deploy.invalid.ide.state=<p>ISR на отдалечения хост отчете невалидно състояние. Можете да разгледате следните опции за разрешаване на проблема\:</p><ul><li>Щракнете върху „Управление на бекенда“, за да отворите мениджъра на бекенда и да спрете да изпълнявате бекенда на ISR</li><li>Или отворете терминал и използвайте мениджъра на процеси (ps, top, htop), за да намерите и прекратите бекенда на ISR</li><li>Рестартирайте хоста</li><li>Изчистете кеша, като използвате бутона „Нулиране на кеша и конфигурацията“ или ръчно от изтриване на съответните директории на отдалечен хост.</li></ul><p>Ако проблемът продължава, моля, създайте проблем в <a href\="{0}">YouTrack</a> и прикачете наличния по-долу регистрационен архив.</p>
