html.text.non.commercial.collection.info=Като се съгласявам, разбирам, че продуктът ще изпрати: a) данни за употребата, за да потвърди съответствието<br>с условията на нетърговския лиценз, b) анонимна статистика за употребата на функции за бъдещи<br>подобрения на продукта. Изпратените данни са в съответствие с <a href\="https\://www.jetbrains.com/legal/docs/privacy/privacy/">Правилата за поверителност на JetBrains</a>.
html.text.non.commercial.license.info=Безплатно за: <ul><li>Обучение и самообразование</li><li>Създаване на съдържание</li><li>Отворен код и развитие на хоби</li></ul>
