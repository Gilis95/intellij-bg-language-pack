libraries.node.text.application.server=Библиотеките съдържат класове, които добавят различни функционалности към вашите приложения. Библиотеките също включват изходни файлове и JavaDocs, които помагат при разработването на проекти.<br><br>IntelliJ IDEA използва библиотеки за довършване на код, валидиране, осветяване на грешки и т.н.<br><br>Библиотеките на сървъра на приложения са част от сървъра на приложения (WebSphere, WebLogic, Tomcat и т.н.) и са достъпни за уеб и Java EE приложения, конфигурирани за тези сървъри.<br><br>Разширете възела и изберете деца за управление на библиотеки на сървър на приложения, инсталирани на вашата система.<br><br>За да свържете библиотека към модул, изберете модула, щракнете върху раздела Зависимости, щракнете върху Добавяне и посочете местоположението на библиотеката.
