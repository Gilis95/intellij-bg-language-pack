ddl.generate.in.existing.file.feature.description=С тази функция можете да генерирате DDL изрази за вашите JPA обекти само с няколко кликвания. Той може да генерира начални скриптове за създаване на схема на база данни от нулата или диф DDL за актуализиране на съществуваща база данни до най-новото състояние според JPA обекти. Тази функция е полезна и като алтернатива на склонното към грешки свойство spring.jpa.hibernate.ddl-auto. С помощта на JPA Buddy операции получавате пълен контрол върху DDL преди изпълнение, правилно съпоставяне на Java -> DB тип, поддръжка за конвертори на атрибути и съпоставяне на тип Hibernate, генериране на изявления за изтриване и много повече.
