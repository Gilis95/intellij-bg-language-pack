generate.ddl.by.entities=С операцията Generate DDL on Entities разработчиците могат да трансформират обекти в DDL изрази само с няколко кликвания. Той може да генерира начални скриптове за създаване на схема на база данни от нулата или диф DDL за актуализиране на съществуваща база данни до най-новото състояние според JPA обекти. Тази функция е полезна и като алтернатива на склонното към грешки свойство spring.jpa.hibernate.ddl-auto. С помощта на JPA Buddy операции получавате пълен контрол върху DDL преди изпълнение, правилно съпоставяне на Java -> DB тип, поддръжка за конвертори на атрибути и съпоставяне на тип Hibernate, генериране на изявления за изтриване и много повече.
generate.ddl.from.run.console.feature.description=Това изключение възниква, когато вашите JPA обекти не могат да бъдат съпоставени правилно към таблици и полета на база данни. JPA Buddy предоставя много полезна функция за лесно решаване на този проблем. Генерирайте DDL директно от проследяване на стека, за да разрешите разликите между JPA обекти и базата данни! След това проверете генерирания скрипт, стартирайте го и рестартирайте приложението. Същият проблем може да бъде разрешен чрез повторно изграждане или актуализиране на базата данни с помощта на свойствата ddl-auto или hbm2ddl. Това решение обаче има сериозни ограничения. Гледайте видеоклипа по-долу, за да научите за тези ограничения и най-доброто решение, предлагано от JPA Buddy.
