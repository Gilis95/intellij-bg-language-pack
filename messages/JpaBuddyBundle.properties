subscription.request.title=Лицензия IntelliJ IDEA Ultimate
subscription.request.topLabel=Забелязахме, че използвате IntelliJ IDEA Community Edition с текущ лиценз JPA Buddy, който скоро изтича. Както знаете, JPA Buddy беше придобит от JetBrains през 2023 г. Оттогава всички платени функции на JPA Buddy бяха преместени в IntelliJ IDEA Ultimate. За да ви осигурим продължителен достъп до платените функции на JPA Buddy, ние ви предлагаме шестмесечен лиценз IntelliJ IDEA Ultimate.
