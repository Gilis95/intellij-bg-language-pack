toolWindow.infoDialog.text=Минималистичният режим е предназначен да минимизира разсейването на програмиста. Ако искате да имате всичко под ръка, това ще ви хареса!<br/><ul><li>Прозорецът на инструмента JPA Buddy ще бъде скрит;<li>JPA Explorer ще бъде наличен в прозореца на инструмента за проекти заедно с други опции (Проект, пакети и др.);<li>Всички операции от JPA Designer са налични в менюто <b>Генериране</b> (<b>{0}</b>), менюто <b>Контекстни действия</b> (<b>{1}</b>) и в <b>Лентата с инструменти на редактора</b>;<li>Алтернативно можете да извикате JPA Designer, като щракнете върху „Добавяне на клавишна комбинация“ или по-късно обвържете любимите си клавишни комбинации в <b>{2} -> Клавишна карта</b>.<li>Можете също да посочите <a href\="\#designer-settings">персонализирани настройки за видимост</a> за този прозорец инструменти;</li></ul>Разгледайте нашето <a href\="https\://www.jetbrains.com/help/idea/jpa-buddy-minimalist-mode.html">ръководство</a> за минималистичен режим.
