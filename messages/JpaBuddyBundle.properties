re.columns.from.db.feature.description=Ако предпочитате първо да проектирате базата данни и след това да пишете JPA обекти за картографиране на таблиците, тази функция ще бъде много удобна и ще спести много време в ежедневната ви работа! Използвайки операцията „Колони от DB“, можете да конвертирате избрани свойства в полета на JPA обект. Той също така поддържа картографиране на асоциации ManyToOne, OneToOne, OneToMany и ManyToMany. Най-хубавото е, че не регенерира целия обект, а по-скоро добавя нови полета към съществуващата декларация на обекта.
re.entities.from.db.feature.description=Ако предпочитате първо да проектирате базата данни и след това да пишете JPA обекти, за да картографирате таблиците, или ако разработвате приложение върху съществуваща база данни, тази функция ще бъде много удобна и ще спести много време в ежедневната ви работа! С операцията „Генериране на обекти от DB“ можете да конвертирате избрани таблици на база данни и техните свойства в JPA обекти само с няколко щраквания, включително ограничения, индекси, свойства на колони и т.н. Освен това поддържа картографиране на асоциации ManyToOne, OneToOne, OneToMany и ManyToMany. Най-хубавото е, че не регенерира целия обект, а по-скоро добавя нови полета към съществуващата декларация на обекта.
