flyway.diff.feature.description=Генерирането на миграция с версия на Flyway е много полезна функция, която може да спести много време в ежедневната ви работа. Използвайки тази функция, можете автоматично да генерирате миграции, съдържащи DDL, необходим за актуализиране на базата данни, за да съответства на вашия JPA модел. Такива миграции на Flyway с diff DDL могат да бъдат генерирани чрез сравняване на JPA обекти от една база данни, две бази данни или дори JPA обекти от един VCS клон с обекти от друг VCS клон, което е полезно, когато нямате достъп до целевата база данни.
flyway.init.feature.description=Операцията за инициализация на схема на Flyway помага на разработчиците да генерират схема на база данни от нулата. Може да използва вашите JPA обекти или съществуваща база данни като източник. Резултатът е миграция на Flyway с версии, съдържаща DDL, необходим за инициализиране на схемата. Тази функция е полезна, ако интегрирате Flyway в съществуващо приложение или решите да генерирате един скрипт за инициализиране на базата данни, вместо да изпълнявате множество наследени миграции. Може също така да ви помогне да настроите нова среда за разработка или тестване.
follow.this.link.to.watch.feature=<a href\="{0}">Гледайте този кратък видеоклип</a>, за да видите функцията в действие.
following.licence.options=Можете да активирате тази функция по следните начини\: <ol><li>Ако все още не сте пробвали IntelliJ IDEA Ultimate, можете да <a href\="https\://www.jetbrains.com/lp/idea-extended-trial/\#\:~\:text\=90%2Dday%20Trial%20for%20Your %20Whole%20Team&text\=Complete%20a%20short%20form%20and,a%20set%20of%20simple%20criteria">заявете пробна версия точно сега за себе си или дори за целия си екип</a></li><li>Ако сте студент или учител, преподавате или изучавате курс или разработвате проект с отворен код, можете да <a href\="https\://www.jetbrains.com/idea/buy/?section\=discounts&billing\=yearly">вземете IntelliJ IDEA Ultimate безплатно</a></li><li><a href\="https\://www.jetbrains.com/idea/buy/?section\=commercial&billing\=yearly">Купете IntelliJ IDEA Ultimate</a></li></ol>
