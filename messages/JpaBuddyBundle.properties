dto.and.mapper.feature.description=DTO са критични за уеб приложенията, но тяхното внедряване води до шаблонен код. Десетки класове, които практически копират вашите обекти, всеки със собствен картограф. С помощта на <b>генериране на DTO</b> можете да спестите време за рутинна работа. Можете да създадете DTO и MapStruct картографи въз основа на JPA дефиниции на обекти, но това не е всичко! Обектите могат да се променят с течение на времето и вие трябва да промените съответно DTO. JPA Buddy решава и този проблем. Позволява ви да <b>синхронизирате обекти с техните DTO</b> и обратно. Освен това JPA Buddy осигурява <b>генериране на JPA обекти от POJO</b> операция, като ви помага да генерирате JPA обекти от всеки клас java/kotlin. Тази функция може да бъде полезна, ако разработвате приложение, използвайки подход на първо място при API: първо дефиниране на DTO за API и след това внедряване на модела на данни.
dto.class.comment.help.tooltip=<html>Променливата <b>ENTITY_FQN</b> е пълното име на обекта, въз основа на който е създаден DTO.</html>
dto.comment.description=<html>Регулярният израз за коментар на връзката позволява на JPA Buddy да асоциира DTO с техните JPA обекти. За да укажете контейнера FQN на целевия обект в коментар, използвайте шаблона <b>(?\\<entity\\>.*)</b>.<br><br>По този начин, ако регулярен израз е дефиниран като <b>A DTO за {@link (?.*)} обект.</b>, той ще бъде анализиран в следния коментар\: <i>//A DTO за {@link io.jpabuddy.demo.entities.Project} обект.</i>.<br><br>Когато полето е празно, функцията е деактивирана.</html>
dto.comment.regexp=Регулярен израз за коментар на връзката
dto.name.pattern.description=<html>Ако използвате стриктна конвенция за именуване между JPA обекти и DTO, можете да го декларирате тук. Това позволява на JPA Buddy да асоциира DTO с техните JPA обекти.<br><br>За да посочите контейнер за просто име на клас на целеви JPA обект, използвайте шаблона <b>(?\\<entity\\>.*)</b>. Например (?.*)Dto означава, че класът MyEntityDto ще бъде третиран като DTO за MyEntity.<br><br>Когато полето е празно, функцията е деактивирана.</html>
