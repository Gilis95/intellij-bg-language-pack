projection.comment.description=<html>Регулярният израз за коментар позволява на JPA Buddy да асоциира проекции с техните JPA обекти. За да посочите контейнера FQN на целевия обект в коментар, използвайте шаблона <b>(?\\<entity\\>.*)</b>.<br><br>Така че, ако регулярен израз е дефиниран като <b>Проекция за обекта {@link (?.*)}.</b>, той ще бъде разпознат в коментара\: <i>//Проекция за {@link io.jpabuddy.demo.entities.Project} обект.</i>.<br><br>Функцията е деактивирана, ако полето е празно.</html>
projection.name.pattern.description=<html>Ако използвате строги правила за именуване между JPA обекти и проекции, можете да ги декларирате тук. Това позволява на JPA Buddy да асоциира проекции с техните JPA обекти.<br><br>За да посочите контейнер за просто име на клас на целевия JPA обект, използвайте шаблона <b>(?\\<entity\\>.*)</b>. Например (?.*)Prj означава, че класът MyEntityPrj ще бъде третиран като проекция за MyEntity.<br><br>Функцията е деактивирана, ако полето е празно.</html>
