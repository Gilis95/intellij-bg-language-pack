view.mode.extensive.help=Показва прозореца на инструмента JPA Buddy и цялото му съдържание. Полезно за тези, които тепърва започват да работят с JPA. Всички популярни опции са винаги пред очите ви, така че е по-лесно да научите и изберете правилните опции за генериране и модифициране на код.
view.mode.minimalistic=Минималистичен
view.mode.minimalistic.help=Не показва прозореца на инструмента JPA Buddy. JPA Explorer е наличен като опция в прозореца на инструмента за проекта. Опциите за генериране на код са достъпни чрез стандартната клавишна комбинация за генериране (<b>{0}</b>) или в лентата с инструменти на редактора. JPA Inspector е наличен като изскачащ прозорец и може да бъде извикан чрез намерения или клавишна комбинация (<b>{1}</b>). Полезно за тези, които предпочитат да използват клавишни комбинации вместо визуални инструменти.
