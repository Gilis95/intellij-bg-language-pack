liquibase.diff.feature.description=Генерирането на регистър на промените в Liquibase е много полезна функция, която може да спести много време в ежедневната ви работа. Използвайки тази функция, можете автоматично да генерирате регистър на промените на Liquibase, съдържащ целия код, необходим за актуализиране на базата данни според вашия JPA модел. Diff changelog може да бъде генериран чрез сравняване на JPA обекти от една база данни, две бази данни или дори JPA обекти от един VCS клон с обекти от друг VCS клон, което е полезно, когато нямате достъп до целевата база данни.
liquibase.diff.in.existing.file.feature.description=Генерирането на регистър на промените в Liquibase е много полезна функция, която може да спести много време в ежедневната ви работа. Използвайки тази функция, можете автоматично да генерирате регистър на промените на Liquibase, съдържащ целия код, необходим за актуализиране на базата данни според вашия JPA модел. Diff changelog може да бъде генериран чрез сравняване на JPA обекти от една база данни, две бази данни или дори JPA обекти от един VCS клон с обекти от друг VCS клон, което е полезно, когато нямате достъп до целевата база данни.
liquibase.init.feature.description=Операцията за инициализация на схемата на регистъра на промените на Liquibase помага на разработчиците да генерират схема на база данни от нулата. Може да използва вашите JPA обекти или съществуваща база данни като източник. Резултатът е регистър на промените на Liquibase, съдържащ всички команди, необходими за инициализиране на схемата. Тази функция е полезна, ако интегрирате Liquibase в съществуващо приложение или решите да генерирате един скрипт за инициализиране на базата данни, вместо да изпълнявате множество стари журнали за промени. Може също така да ви помогне да настроите нова среда за разработка или тестване.
