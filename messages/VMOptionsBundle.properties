vm.option.add.exports.description=Актуализира \\<module\\> за експортиране на \\<package\\> към \\<target-module\\>, независимо от декларацията на модула. \\<target-module\\> може да бъде ALL-UNNAMED за експорт към всички ненаименувани модули.
vm.option.add.opens.description=Актуализира \\<module\\> за отваряне на \\<package\\> за \\<target-module\\>, независимо от декларацията на модула.
vm.option.add.reads.description=Актуализира \\<module\\> да чете \\<target-module\\>, независимо от декларацията на модула. \\<target-module\\> може да бъде ALL-UNNAMED за четене на всички ненаименувани модули.
vm.option.advanced.option.description=Указва нестандартна опция, специфична за JVM.
vm.option.agentlib.description=Зарежда собствената библиотека на агент с име \\<libname\\>.
vm.option.agentpath.description=Зарежда собствената библиотека на агента на \\<име на пътя\\>.
vm.option.batch.description=Деактивира фоновата компилация.
vm.option.bootclasspath.a.description=Добавя системни класове в края на пътя на зареждане.
vm.option.bootclasspath.description=Задава пътя за търсене на системни класове и ресурси.
vm.option.bootclasspath.p.description=Добавя системни класове в началото на пътя на зареждане.
vm.option.check.jni.description=Извършва допълнителни проверки на функциите на JNI.
vm.option.comp.description=Принуждава методите да бъдат компилирани при първото им извикване.
vm.option.debug.description=Не прави нищо. Отляво за обратна съвместимост.
vm.option.diag.description=Показва допълнителни диагностични съобщения.
vm.option.disable.assertions.description=Разрешава проверки на твърдения при посочената детайлност.
vm.option.disable.files.description=Деактивира по-нататъшното разширяване на файлове с аргументи.
vm.option.disable.system.assertions.description=Деактивира проверките на системните твърдения.
vm.option.enable.assertions.description=Разрешава проверки на твърдения при посочената детайлност.
vm.option.enable.system.assertions.description=Позволява проверки на системни твърдения.
vm.option.finalization.description=Управлява как се извършва финализирането на обект в JVM, където \\<value\\> може да бъде "разрешено" или "забранено". По подразбиране финализирането е активирано.
vm.option.future.description=Позволява най-строгите проверки, предвиждайки бъдещи настройки по подразбиране. Тази опция е остаряла и може да бъде премахната в бъдеща версия.
vm.option.illegal.access.description=Разрешава или отказва достъп до членове на типове в наименувани модули от код в ненаименувани модули. \\<стойност\\> може да бъде "deny", "permit", "warn" или "debug". Тази опция ще бъде премахната в бъдещите версии.
vm.option.incgc.description=Позволява постепенно събиране на боклук.
vm.option.int.description=Изпълнява приложението само в режим на интерпретация.
vm.option.internalversion.description=Показва по-подробна информация за версията на JVM от опцията -version.
vm.option.javaagent.description=Зарежда Java агента на \\<jarpath\\>.
vm.option.limit.modules.description=Ограничава набора от наблюдаеми модули.
vm.option.log.description=Конфигурира или разрешава регистриране с помощта на унифицираната JVM рамка за регистриране. Използвайте -Xlog\:help за подробности.
vm.option.loggc.description=Записва статус на GC във файл с времеви клейма. Тази опция е остаряла и може да бъде премахната в бъдеща версия. Той е заменен с -Xlog\:gc\:\\<файл\\>.
vm.option.mixed.description=Смесен режим на изпълнение (по подразбиране).
vm.option.mn.description=Задава началния и максималния размер (в байтове) на купчината на детската стая.
vm.option.ms.description=Задава първоначалния размер на купчината на Java.
vm.option.mx.description=Задава максималния размер на Java heap.
vm.option.noclassgc.description=Деактивира събирането на боклук за класове.
vm.option.patch.module.description=Заменя или разширява модул с класове и ресурси от JAR файлове или директории.
vm.option.prof.description=Извежда данни за профилиране на процесора.
vm.option.rs.description=Намалява използването на OS сигнал в Java/VM (вижте документацията).
vm.option.share.auto.description=Използва данни от общ клас, ако е възможно (по подразбиране).
vm.option.share.off.description=Не се опитва да използва споделени данни от класа.
vm.option.share.on.description=Изисква използването на данни от общ клас, в противен случай се проваля с грешка. Това е тестова опция и може да причини периодични сривове. Не трябва да се използва в производствена среда.
vm.option.showSettings.all.description=Показва всички настройки и продължава да работи.
vm.option.showSettings.description=Показва всички настройки и продължава да работи.
vm.option.showSettings.locale.description=Показва всички локални настройки и продължава да работи.
vm.option.showSettings.properties.description=Показва всички настройки на собствеността и продължава да работи.
vm.option.showSettings.system.description=(Само за Linux) Показва конфигурацията на хост системата или контейнера и продължава.
vm.option.showSettings.vm.description=Показва всички настройки на виртуалната машина и продължава да работи.
vm.option.source.description=Задава \\<версия\\> на изходния код в режим на изходен файл.
vm.option.ss.description=Задава размера на стека на Java нишка. Действителният размер може да бъде закръглен до кратно на размера на системната страница, както се изисква от операционната система.
vm.option.system.property.description=Задава системно свойство във формат \\<име\\>\=\\<стойност\\>.
vm.option.verify.description=Задава режима на проверка на байт код. Моля, обърнете внимание, че опцията -Xverify\:none е остаряла и може да бъде премахната в бъдеща версия.
