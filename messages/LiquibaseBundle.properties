target.type.help=<html>За да се опрости съпоставянето на типове, системата за контрол на версията на базата данни използва независими от базата данни SQL типове, които се конвертират в специфични за базата данни типове. Например <code>varchar</code> се преобразува в <code>varchar2</code> за Oracle DB и остава като <code>varchar</code> за PostgreSQL.<br><br>Всеки независим от базата данни тип има набор от псевдоними (например <code>java.sql.Types.VARCHAR</code> или <code>character varying</code>), които са взаимозаменяеми в повечето случаи.<br><br>Неизвестните типове се използват без трансформация.<html>
