project.upgrade.studio.notification.body.different.channel.recommendation=Вашият проект е конфигуриран с версия на SDK за компилация, която не се поддържа от тази версия на Android Studio ({0}). Препоръчваме настройка {1} или по-висока за работа с този проект. Можете също да инсталирате допълнителна версия на Android Studio върху текущата, като следвате <a href\="https\://developer.android.com/studio/preview/install-preview\#install_alongside_your_stable_version">това ръководство</a>.
project.upgrade.studio.notification.body.no.recommendation=Вашият проект е конфигуриран с версия на SDK за компилация, която не се поддържа от тази версия на Android Studio ({0}). Понастоящем няма версия на Android Studio, която да поддържа тази версия на SDK за компилация. Възможно е да има проблеми с този проект. Ако срещнете проблеми, моля, докладвайте за грешка, като изберете <b>Помощ > Изпратете обратна връзка</b>.
project.upgrade.studio.notification.body.same.channel.recommendation=Вашият проект е конфигуриран с версия на SDK за компилация, която не се поддържа от тази версия на Android Studio ({0}). Може да искате да надстроите до {1} или по-висока за по-добра поддръжка на WBS за този проект.<br/><br/>Не забравяйте, че процесът на надстройка ще ви отведе до най-новата версия на Android Studio. Ако тази версия е няколко версии по-висока от текущата ви, тя може вече да не поддържа някои компоненти или API, използвани във вашия проект.
