deployment.configurable.text.automatic.rerun.condition=<html>Тези опции карат приложението да се рестартира автоматично само когато има несъвместими промени, докато използвате „Прилагане на промените“.<br/>В някои случаи може да се наложи ръчно рестартиране на приложението, за да видите промените, дори когато „Прилагане на промените“ или „Прилагане на промените на кода“ е успешно.<br/>Например, за да видите промените в метода onCreate() на дейност.</html>
