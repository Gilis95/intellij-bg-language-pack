ddms.corrupted.error=Предупреждение\: Някои процеси не се показват поради липсваща информация за отстраняване на грешки. Това може да бъде причинено от други работещи приложения (напр. IntelliJ с плъгин за Android) или друго копие на Android Studio от друг канал (бета или Canary). Затворете тези приложения, за да покажете всички процеси. Ако няма работещи приложения, опитайте да изключите/свържете устройството и рестартирайте adb сървъра с командата `adb kill-server`.
