go.quick.doc.blank.identifier.hint=Празният идентификатор ('_') може да бъде присвоен или деклариран с произволна стойност от произволен тип. Празните идентификатори се отхвърлят и не се използват от компилатора. Например, можете да използвате празни идентификатори, когато искате върната стойност, но не планирате да я използвате по-късно.
