go.quick.doc.type.assertions.hint=Утвържденията за тип се използват, за да се провери дали дадена променлива е от определен тип и да се върне базовата стойност на интерфейса. Утвържденията за тип работят само с интерфейси. Например в следния код\: 'var x interface{} \= 42 t \:\= x.(int)', 'x' е от тип 'interface{}' с основна стойност int ('42'), 'int' е конкретният тип, който искаме да проверим. Ако отпечатаме 't', резултатът ще бъде '42'. Промяната на конкретния тип на 'string' ('t \:\= x.(string)') ще предизвика паника по време на изпълнение. \nУтвържденията за тип могат да върнат две стойности. Например изразът 't, ok \:\= x.(int)' има булева стойност 'ok', която връща 'true', ако твърдението е вярно. Ако 'ok' е 'false', 't' се настройва на нула и не възниква паника.
go.quick.doc.type.definition.hint=Тип {0} е нов тип с основен тип {1}. Тези видове са различни. За повече информация вижте {2}
go.quick.doc.type.parameter.hint=Декларацията {0} декларира параметри на типа. Тези параметри на типа правят {0} общ. Общият {0} може да работи с множество типове. Наборът от възможни типове се определя от ограничението на параметъра на типа. За повече информация относно генеричните продукти вижте {1}
go.quick.doc.type.parameter.hint.hyperlink.text=Урок\: Първи стъпки с генерични продукти на go.dev
go.quick.doc.type.parameter.in.method.hint=Методът е общ, тъй като основният тип на приемника е общ тип. Спецификацията на метода трябва да декларира параметри на типа, които съответстват на параметрите на типа на основния тип приемник. Аргументите на типа на метода трябва да използват ограниченията на типа, използвани в основния тип на приемника. За повече информация относно генеричните продукти вижте {0}
