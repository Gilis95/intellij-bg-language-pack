go.quick.doc.iota.example=Например 'const (C0 \= йота; C1; C2)' ще отпечата '0', '1' и '2'. Броячът се нулира на '0' всеки път, когато използвате 'const' във вашия код. За да видите стойностите на константите, присвоени на „йота“, задръжте курсора на мишката върху спецификацията на константата.
