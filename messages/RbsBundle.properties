rbs.language.configurable.collection.description=<a href\="https\://github.com/ruby/gem_rbs_collection">RBS колекция</a> е управлявана от общността колекция от типови подписи за скъпоценни камъни, които се доставят без тях. Подписите на типове ще се зареждат автоматично във фонов режим, подобрявайки поддръжката на типове и анализа на кода за всички скъпоценни камъни, използвани в даден проект. Тази функция не променя проекта или неговите файлове.
