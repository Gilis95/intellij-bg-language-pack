spring.controller.request.param.help.authenticatedPrincipal=Анотацията, използвана за преобразуване на Authentication.getPrincipal() в аргумент на метод.
spring.controller.request.param.help.bindingResult=За достъп до грешки при валидиране и обвързване на данни за команден обект (т.е. аргумента @ModelAttribute) или грешки при валидиране за аргументите @RequestBody или @RequestPart. Трябва да декларирате аргумента Errors или BindingResult веднага след аргумента на метода, който ще се тества.
spring.controller.request.param.help.csrfToken=Предоставя информация за очаквания CSRF токен.
spring.controller.request.param.help.errors=За достъп до грешки при валидиране и обвързване на данни за команден обект (т.е. аргумента @ModelAttribute) или грешки при валидиране за аргументите @RequestBody или @RequestPart. Трябва да декларирате аргумента Errors или BindingResult веднага след аргумента на метода, който ще се тества.
spring.controller.request.param.help.httpEntity=За достъп до заглавките и тялото на заявката. Тялото се преобразува с помощта на HttpMessageConverter.
spring.controller.request.param.help.httpMethod=HTTP метод запроса.
spring.controller.request.param.help.httpSession=Осигурява присъствие на сесия. Следователно такъв аргумент никога няма да бъде нищожен. Моля, обърнете внимание, че достъпът до сесията не е безопасен за нишки.
spring.controller.request.param.help.inputStream=За достъп до необработеното тяло на заявката, предоставено от API на сервлета.
spring.controller.request.param.help.locale=Текущият локал на заявката, определен от най-специфичния наличен LocaleResolver (всъщност конфигурираният LocaleResolver или LocaleContextResolver).
spring.controller.request.param.help.map=За достъп до модела, използван в HTML контролери и предоставен на шаблони като част от рендирането на изглед.
spring.controller.request.param.help.model=За достъп до модела, използван в HTML контролери и предоставен на шаблони като част от рендирането на изглед.
spring.controller.request.param.help.modelMap=За достъп до модела, използван в HTML контролери и предоставен на шаблони като част от рендирането на изглед.
spring.controller.request.param.help.nativeWebRequest=Споделяне на параметри на заявка, заявка и атрибути на сесия без директно използване на API на сервлета.
spring.controller.request.param.help.oAuth2AuthorizedClient=Реализациите на този интерфейс са отговорни за цялостното управление на оторизираните клиенти.
spring.controller.request.param.help.outputStream=За достъп до тялото на необработения отговор, предоставено от API на сервлета.
spring.controller.request.param.help.pagination=Обект, съдържащ информация за страниране.
spring.controller.request.param.help.principal=Текущо удостовереният потребител, евентуално конкретен клас на изпълнение на принципал, ако е известен. Обърнете внимание, че този аргумент не се разрешава незабавно, ако е анотиран, за да позволи на потребителския резолвер да го разреши, преди да се върне към стандартна резолюция чрез HttpServletRequest\#getUserPrincipal. Например Spring Security Authentication прилага Principal и ще бъде инжектиран като такъв чрез HttpServletRequest\#getUserPrincipal, освен ако не е анотиран и с @AuthenticationPrincipal, в който случай се разрешава от персонализирания Spring Security резолвер чрез Authentication\#getPrincipal.
spring.controller.request.param.help.pushBuilder=API на Servlet 4.0 push builder за програмно изпращане на HTTP/2 ресурси. Обърнете внимание, че според спецификацията на Servlet, инжектиран екземпляр на PushBuilder може да е нулев, ако клиентът не поддържа тази HTTP/2 функция.
spring.controller.request.param.help.reader=За достъп до необработеното тяло на заявката, предоставено от API на сервлета.
spring.controller.request.param.help.redirectAttributes=Указва атрибути, които да се използват в случай на пренасочване (т.е. да се добавят към низа на заявката) и флаш атрибути, които да се съхраняват временно до заявката след пренасочването.
spring.controller.request.param.help.servletRequest=Споделяне на заявка за сервлет
spring.controller.request.param.help.servletResponse=Споделяне на сървлет отговор
spring.controller.request.param.help.sessionStatus=За да отбележи завършването на обработката на формуляра, което задейства почистването на атрибутите на сесията, декларирани чрез анотацията @SessionAttributes на ниво клас.
spring.controller.request.param.help.sort=Опция за сортиране на заявки. Трябва да предоставите най-малко списък със свойства за сортиране, който не трябва да съдържа нулеви или празни низове. Посоката по подразбиране е DEFAULT_DIRECTION.
spring.controller.request.param.help.uriComponentsBuilder=За да подготвите URL по отношение на хоста, порта, схемата, контекстния път и буквалната част от съпоставянето на сървлета на текущата заявка.
spring.controller.request.param.help.webRequest=Разширява интерфейса ServletRequest, за да предостави информация за заявка за HTTP сървлети. Контейнерът на сървлета създава обект HttpServletRequest и го предава като аргумент към методите на услугата на сервлета (doGet, doPost и т.н.).
spring.controller.request.param.help.webResponse=Разширява интерфейса ServletResponse, за да предостави специфична за HTTP функционалност при изпращане на отговор. Например, има методи за достъп до HTTP заглавки и бисквитки. Контейнерът на сървлета създава обект HttpServletResponse и го предава като аргумент към методите на услугата на сервлета (doGet, doPost и т.н.).
spring.controller.request.param.help.writer=За достъп до тялото на необработения отговор, предоставено от API на сервлета.
spring.controller.request.param.help.zoneId=Часовата зона, свързана с текущата заявка, както е определена от LocaleContextResolver.
spring.mvc.controllers.not.found=Пролетните MVC контролери не са намерени
