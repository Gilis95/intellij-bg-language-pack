diagram.graph.characteristics.is.planar=Планарно\:
diagram.graph.characteristics.is.planar.context.help=Една графика се нарича <i>равнинна</i>, ако може да бъде начертана върху равнина без пресичащи се ръбове
diagram.graph.characteristics.is.simple=Просто\:
diagram.graph.characteristics.is.simple.context.help=Една графика се нарича <i>проста</i>, ако не съдържа две отделни ребра <code>e1, e2</code>, където <code>e1.source()</code> е равно на <code>e2.source()</code> и <code>e1.target()</code> е равно на <code>e2.target()</code>
