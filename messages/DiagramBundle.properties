diagram.graph.characteristics.is.biconnected=Двойно свързан\:
diagram.graph.characteristics.is.biconnected.context.help=Графът се нарича <i>двойно свързан</i>, ако няма точки на артикулация, т.е. възли, чието премахване прави графа несвързан
diagram.graph.characteristics.is.bipartite=Двусемеделни\:
diagram.graph.characteristics.is.bipartite.context.help=Графът се нарича <i>двустранен</i>, ако неговите възли могат да бъдат разделени на два набора, така че всеки ръб да свързва възли от различни набори
diagram.graph.characteristics.is.connected=Свързан\:
diagram.graph.characteristics.is.connected.context.help=Една графика се нарича <i>свързана</i>, ако има ненасочен път от ръбове между всяка двойка възли
diagram.graph.characteristics.is.forest=гора\:
