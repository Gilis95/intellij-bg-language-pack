diagram.graph.characteristics.density=Плътност\:
diagram.graph.characteristics.density.context.help=<i>Плътността</i> е съотношението на броя на ръбовете в една графика към максималния възможен брой ръбове и се определя като: <code>numberOfEdges / (numberOfNodes * (numberOfNodes - 1))</code>
