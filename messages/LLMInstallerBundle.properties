welcome.feature.ask.about.code.after.steps=<b>Съвет</b>\: AI Assistant знае за позицията на курсора и маркирания код в редактора, текущия файл и отворените раздели.<br><br><b>Примери за подкани</b>\:<ul><li>Какво прави <b>secretMethod</b>?<li>Къде е <b>упълномощаването</b> в моя проект?<li>Обяснете кода под курсор.<li>Какво прави маркираният код?<li>Опишете кода в текущия ми файл.<li>Какви файлове са отворени?</ul>
welcome.feature.ask.about.code.steps=Изберете конкретна част от кода в редактора и щракнете с десния бутон, за да отворите контекстното меню.<p>Изберете <b>AI Действия</b>, след което <b>Нов чат с помощта на селекция</b>.
welcome.feature.ask.about.code.title=Задавайте въпроси относно кода на проекта
welcome.feature.ask.about.local.changes.and.commits.beforeSteps=Можете да задавате въпроси на AI Assistant, свързани с VCS.<p><b>Примери за подкани</b>\:<ul><li>Какъв беше последният комит?<li>Показване на историята на Къмитите.<li>Показване на разликата между последните два ангажимента.<li>Показване на некомитирани промени.<li>Какви са изходящите промени?</ul>
welcome.feature.ask.about.local.changes.and.commits.title=Задавайте въпроси за SLE
welcome.feature.ask.questions.before.steps=Можете да зададете общи въпроси за програмиране на AI Assistant.<br><br><b>Примери за подкани</b>\:<ul><li>Каква е CAP теоремата?<li>Как да потвърдите имейл адрес с помощта на регулярен израз?<li>Как да генерирате произволни цели числа в даден диапазон в Java?<li>Обяснете как да напишете ефективен Dockerfile за внедряване на приложения за Spring Boot.<li>Предоставете инструкции стъпка по стъпка за създаване на CRUD приложение с помощта на Ktor с RESTful API</ul>
welcome.feature.ask.questions.title=Задавайте въпроси за програмиране
welcome.feature.code.generation.steps=Поставете курсора където и да е в редактора или изберете част от код и натиснете {0}.<p>В полето за въвеждане напишете вашата подкана и натиснете <kbd>Enter</kbd>.<p>За да подобрите резултатите, напишете допълнителна подкана в полето за въвеждане и натиснете <kbd>Enter</kbd>.<p>Приемете генерирания код, като щракнете върху <shortcut actionId\="ViewSource"/>, или отхвърлете го, като натиснете <kbd>Esc</kbd>.
welcome.feature.code.generation.title=Генерирайте код според описанието
welcome.feature.convert.to.another.language.steps=Отворете файла, който искате да конвертирате, поставете курсора в редактора и щракнете с десния бутон, за да отворите контекстното меню.<p>Изберете <b>AI Действия</b>, след това <b>Конвертиране на файл на друг език</b>.<p>Изберете езика, на който искате да конвертирате текущия файл.
welcome.feature.convert.to.another.language.title=Преобразуване на друг език
welcome.feature.craft.prompt.library.before.steps=За да създадете своите подкани, можете\:<ul><li>Щракнете с десния бутон на мишката в редактора, за да отворите контекстното меню, след което отидете на <b>AI Actions | Добавете своите подкани</b>.<li>Щракнете върху <icon src\="com.intellij.icons.AllIcons.Actions.MenuSaveall"/> <b>Запазване на текущата подкана</b> в полето за въвеждане на чат на AI ​​Assistant, за да запазите подканата си.<li>Или отворете настройките и изберете <b>Инструменти | AI асистент | Библиотека с подкани</b>.</ul><br><b>Съвет</b>\: Използвайте променливата <b>$SELECTION</b>, за да добавите текущия избор на код към подканата.
welcome.feature.craft.prompt.library.title=Създайте библиотека от подкани
welcome.feature.explain.code.afterSteps=Това работи и за регулярни изрази, SQL заявки, cron изрази и други инжектирани фрагменти.
welcome.feature.explain.code.steps=Изберете част от кода и щракнете с десния бутон, за да отворите контекстното меню.<p>Изберете <b>AI Действия</b>, след което <b>Обяснете кода</b>.
welcome.feature.explain.code.title=Обяснете кода
welcome.feature.explain.commit.steps=Отворете <icon src\="com.intellij.icons.AllIcons.General.Vcs"/> <b>прозорец на Git</b>.<p>В панела с къмити изберете един или повече къмити, за да обясните AI ​​Assistant.<p>Щракнете с десния бутон и изберете <b>Explain Commit with AI Assistant</b> от контекстното меню.
welcome.feature.explain.commit.title=Обяснете Къмитите
welcome.feature.explain.runtime.error.title=Обяснете грешките по време на изпълнение
welcome.feature.explain.runtime.errors.before.steps=Ако възникне грешка по време на изпълнение\:
welcome.feature.explain.runtime.errors.steps=Щракнете върху <icon src\="com.intellij.llmInstaller.LLMIcons.AiAssistantColored"/> <b>Обяснете с AI</b> в конзолата.<p>Или маркирайте съобщението за грешка, отворете контекстното меню и щракнете върху <b>Обяснете съобщението за грешка с AI</b>.
welcome.feature.find.potential.problems.steps=Изберете кодовия фрагмент и щракнете с десния бутон, за да отворите контекстното меню.<p>Изберете <b>AI Действия</b>, след което <b>Намиране на проблеми</b>.
welcome.feature.find.potential.problems.title=Намерете грешки и предложете корекции
welcome.feature.generate.commit.messages.after.steps=<b>Конфигуриране на подкани</b>\:<br>Отворете настройките за ангажимент в долния десен ъгъл на полето за съобщение за комит.<p>Или отидете на <b>Настройки | Инструменти | AI асистент | Библиотека с подсказки | Генериране на съобщение за ангажиране</b>.
welcome.feature.generate.commit.messages.before.steps=Ако има промени\:
welcome.feature.generate.commit.messages.steps=Открийте <ICON SRC\="com.intellij.ICONS.Allicons.actions.commit"/> <b>окно Извършено</b>.<p>нажмете <b>Генериране на съобщение за ангажиране с AI Assistant</b>.
welcome.feature.generate.commit.messages.title=Генериране на съобщения за ангажиране
welcome.feature.inline.code.completion.after.steps=Можете също ръчно да извикате довършване на код, като натиснете <shortcut actionId\="CallInlineCompletionAction"/>.<p><b>Съвет</b>\: Задръжте курсора на мишката над изречение с код, за да промените ключа, който приема предложения от AI Assistant.
welcome.feature.inline.code.completion.steps=Започнете да пишете в редактора, за да получите незабавни предложения.<p>За да приемете предложения код, натиснете <shortcut actionId\="InsertInlineCompletionAction"/>.<p>За да отхвърлите предложението, натиснете <kbd>Esc</kbd>.
welcome.feature.inline.code.completion.title=Добавяне на код
welcome.feature.name.suggestions.steps=Поставете курсора върху това, което искате да преименувате.<p>Щракнете с десния бутон, за да отворите контекстното меню, изберете <b>Refactor</b>, след което <b>Rename</b>.
welcome.feature.name.suggestions.title=Предложете заглавия
welcome.feature.refactoring.suggestions.afterSteps=<b>Съвет</b>\: Можете да използвате това и други <b>действия с изкуствен интелект</b>, без да избирате конкретна част от кода. Поставете курсора върху желания клас или метод, изберете действието AI и изберете необходимия кодов фрагмент.
welcome.feature.refactoring.suggestions.steps=Изберете част от кода и щракнете с десния бутон, за да отворите контекстното меню.<p>Изберете <b>AI Actions</b>, след това <b>Suggest Refactoring</b>.<p>В полето за код за преработване щракнете върху <b>Виж разликите</b>, за да отворите програмата за преглед на разликите.
welcome.feature.refactoring.suggestions.title=Предложете рефакторинг
welcome.feature.reference.files.before.steps=Изпълнете насочени заявки във вашия проект.<br><br><b>Примери за подкани</b>\:<ul><li>Къде в <b>\#thisFile</b> има грешка off-by-one?<li>Коя от моите <b>\#localChanges</b> има грешка off-by-one?<li>Къде в <b>\#file\:Foo.kt</b> има ли грешка off-by-one?<li>Къде в <b>\#symbol\:Foo</b> има грешка off-by-one?<li>Какво е значението на <b>\#jupyter_var\:foo</b>?</ul>
welcome.feature.reference.files.title=Файлови връзки
welcome.feature.sql.use.correct.objects.steps=Поставете курсора върху синтактичната грешка във вашия SQL код.<p>Изберете <i>AI Actions</i>, след това <i>Fix SQL Problem</i>.<p>Кодът ще бъде коригиран в редактора.<p>Използвайте действието <i>Undo</i>, ако не сте доволни от резултата.
welcome.feature.unit.tests.generation.afterSteps=<b>Настройване на подкани</b>\:<br>Отидете на <b>Настройки | Инструменти | AI асистент | Библиотека с подсказки | Генериране на модулни тестове</b>.
welcome.feature.unit.tests.generation.steps=Поставете курсора навсякъде в метода и щракнете с десния бутон, за да отворите контекстното меню.<br>Или щракнете върху <shortcut actionId\="ShowIntentionActions"/>.<p>Изберете <b>AI Actions</b>, след това <b>Generate Unit Tests</b>.<p>За да подобрите генерирания код, щракнете върху <b>Secify</b> и добавете нови изисквания в раздела <b>AI Разлика</b>.
welcome.feature.unit.tests.generation.title=Генериране на тестове
welcome.feature.write.documentation.after.steps=<b>Настройване на подкани</b>\:<br>Отидете на <b>Настройки | Инструменти | AI асистент | Библиотека с подсказки | Напишете документация</b>.
welcome.feature.write.documentation.steps=Изберете кодовия фрагмент и щракнете с десния бутон, за да отворите контекстното меню.<p>Изберете <b>AI Действия</b>, след това <b>Напишете документация</b>.
welcome.feature.write.documentation.title=Генериране на документация
