inlay.parameters.python.hints.blacklist.explanation=<p>За да деактивирате подсказките за метод или функция, използвайте един от следните шаблони\:</p><ul><li><code><b>(*info)</b></code> - всички функции с един параметър, чието име завършва с <em>info</em><br></li><li><code><b>(a, b)</b></code> - всички функции с параметри <em>a</em> и <em>b</em><br></li><li><code><b>*.put(self, key, value)</b></code> - всички методи <em>put</em> с параметри <em>key</em> и <em>value</em><br></li><li><code><b>Foo.bar(self, a, b)</b></code> - метод <em>bar</em> от класа <em>Foo</em> с параметри <em>a</em> и <em>b</em><br></li><li><code><b>foo(\\<star\\>\\<star\\>kwargs)</b></code> - функция <em>foo</em> с параметър <em>**kwargs</em><br></li></ul><p>Имена или контейнери трябва да бъдат посочени за всички параметри, включително незадължителните.<br>Пълните имена на методите трябва да включва имена на класове или контейнери за тях.<br>Използвайте действието „Не показвай подсказки за текущия метод“ {0}, за да добавите шаблони от редактора.</p>
