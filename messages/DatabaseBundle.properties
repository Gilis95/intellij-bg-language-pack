enable.jcef.message=<html>ПРЕДУПРЕЖДЕНИЕ\!<br><br>Прегледът на пространствени данни работи само когато <a href\='https\://github.com/chromiumembedded/java-cef'>JCEF</a> е активиран.<br><br>В редки случаи активирането на JCEF може да доведе до срив на ISR. Това може да се случи, ако имате инсталирани плъгини, които използват JavaFX.<br>Препоръчваме да запазите копие от тези инструкции за възстановяване на вашия WBS в малко вероятния случай на повреда\:<ol><li>Намерете папката за конфигурация на WBS (вижте <a href\='https\://www.jetbrains.com/help/idea/2020.1/tuning-the-ide.html'>https\://www.jetbrains.com/help/idea/2020.1/tuning-the-ide.html</a>).</li><li>Намерете файла \\<config folder\\>/options/ide.general.xml</li><li>Премахнете следния ред from ide.general.xml\:<pre>\\<entry key\="ide.browser.jcef.enabled" value\="true" /\\></li></ol>Ако имате затруднения, моля свържете се с нас на support@jetbrains.com</html>
