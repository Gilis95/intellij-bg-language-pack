js.editor.basics.module.description=Овладейте основните функции на редактора - започнете да пишете по-добър код и спестявате време за обичайни задачи от първия ден.
js.editor.basics.module.name=Основи на редактора
js.editor.code.editing.comment.delete.unselect.move.up.1=Сега, след като маркирахте кода, можете да го коментирате/декоментирате ({0}), да го изтриете ({1}) или да премахнете отметката от него ({2}).
js.editor.code.editing.comment.delete.unselect.move.up.2=Друго нещо, което можете да направите, е да преместите този код нагоре или надолу във файла. Нека го преместим нагоре с помощта на {0}.
js.editor.code.editing.duplicate.delete.comment=И накрая, нека бързо да опитаме най-популярните действия с низове, като дублиране на низ, изтриване на низ или коментиране. Използвайте {0}, за да дублирате избрания ред. След това натиснете {1} и {2}, за да опитате други операции с низове.
js.editor.code.editing.multi.caret.1=Следва редактиране с няколко курсора. Използвайте го, за да спестите време, когато променяте кода на няколко места едновременно. Поставете курсора в първия таг {0} (ред 10). След това изберете всички {1} етикети в един и същ елемент tr (редове 10-12)\: натиснете {2} шест пъти, докато всички желани тагове бъдат избрани.
js.editor.code.editing.multi.caret.2=Нека заменим {0} с {1} и натиснете {2}, за да излезете от режима с няколко курсора.
js.editor.code.editing.next=Това приключва урока. Щракнете върху бутона по-долу, за да започнете следващия, или използвайте {0}.
js.editor.code.editing.reformat.start=Нека да разгледаме някои съвети и трикове, които ще ви помогнат да редактирате кода много по-бързо. Като за начало, в <ide/> няма нужда ръчно да коригирате форматирането на кода. Преформатирайте кода с помощта на {0}.
js.editor.code.editing.select.word=Сега нека видим как бързо да маркирате фрагменти от код във файл. Натиснете {0} няколко пъти, за да изберете напълно втория tr елемент (редове 14-18).
js.editor.code.editing.tips.and.tricks.title=Съвети и трикове за редактиране на код
js.editor.code.inspection.checkmark=Ако сега погледнете в горния десен ъгъл на редактора, ще видите зелена отметка ({0}), потвърждаваща, че няма повече проблеми с файла. Има обаче още един малък детайл, който може да бъде оптимизиран, за да направи кода по-кратък. Поставете курсора върху {1} ​​(ред 3) и натиснете {2}.
js.editor.code.inspection.intro=Докато работите в редактора, <ide/> непрекъснато анализира вашия код, открива различни проблеми и предлага начини за отстраняването им. В отворения файл има два подчертани проблема на редове 4 и 5. Нека проверим какви са тези проблеми, като натиснете {0}.
js.editor.code.inspection.make.shorter=Сега нека направим нашия функционален израз по-кратък. Изберете бърза корекция {0} и натиснете {1}.
js.editor.code.inspection.next=Това приключва урока. Щракнете върху бутона по-долу, за да започнете следващия, или използвайте {0}.
js.editor.code.inspection.run.intention=Нека изберем {0} и натиснете {1}.
js.editor.code.inspection.show.intentions.1=Можете също да използвате {0}, за да преминавате от една грешка към друга. Или можете да изследвате намерените проблеми, като задържите курсора на мишката върху тях.
js.editor.code.inspection.show.intentions.2=В този файл ISR откри неразрешена променлива - която не беше дефинирана никъде в кода. Тя предлага създаването на нова променлива {0} като едно възможно решение, но трябва да добавим параметър на книга. Поставете курсора върху {1} ​​и натиснете {2}, за да видите пълния списък с поправки.
js.editor.code.inspection.title=Проверки на кодове
js.editor.completion.add.parameter=По този начин можете да видите документацията на JavaScript директно в <ide/>. Сега добавете {0} в {1}, за да продължите.
js.editor.completion.choose.lookup=<ide/> съдържа много функции, които ще ви помогнат да пишете по-добър код и да сте по-продуктивни. Да започнем с допълването на кода. Позволява ви да ускорите кодирането чрез допълване на ключови думи и символи от езиковия API и зависимостите на проекта. Въведете {0} и натиснете {1}, за да завършите автоматично {2}.
js.editor.completion.choose.method=По този начин автоматичното довършване показва контекстуални предложения, докато пишете. За да добавите една от тези оферти, можете да използвате {0}, както направихме току-що, или можете да натиснете {1}, за да замените съществуващ артикул. Сега добавете {2} след {3}, след това въведете {4} и автоматично завършете метода {5} с {0}.
js.editor.completion.console.log.argument=И накрая, нека завършим оператора {0}. Поставете курсора вътре в {1} на ред 8 и добавете {2} чрез довършване на код.
js.editor.completion.next=Това приключва урока. За да започнете следващия, щракнете върху бутона по-долу или използвайте {0}.
js.editor.completion.parameter.info=Подсказката ({0}), която се появява след поставяне на курсора вътре в {1}, ви позволява бързо да видите имената на параметрите на метода и функцията. В някои случаи може да се наложи да прегледате по-подробна документация. Нека направим това, като натиснете {2}.
js.editor.completion.title=Попълване на кода
js.editor.navigation.activate.structure=Прозорецът на инструмента {0} може да ви помогне да изследвате файла по-бързо. Той предоставя преглед на неговата структура и ви позволява да преминете към конкретен елемент, просто като въведете името му. Започнете да пишете {1} навсякъде в областта на кутията с инструменти, натиснете {2} и след това натиснете {3}, за да затворите панела и да отидете на кода.
js.editor.navigation.choose.structure=С този изскачащ прозорец можете бързо да превключвате между последните файлове и прозорците на WBS инструмента. Един от тези прозорци с инструменти може да ви помогне да навигирате в отделен файл. Кликнете върху раздела {0}, за да научите повече.
js.editor.navigation.find.usages=В резултат на нашите действия курсорът се премести на {0} (ред 9). Нека го оставим там и натиснете {1}, за да отворите друг прозорец с инструменти, който ще ви помогне бързо да намерите приложения на всеки елемент.
js.editor.navigation.go.to.declaration=Обърнете внимание на {0} до <strong>Отидете на декларация или употреби</strong> - показва употреби за дефиниране и обратно. Нека затворим изскачащия прозорец, поставим курсора върху {1} ​​(ред 16) и щракнете върху {0}, за да намерите неговата реклама.
js.editor.navigation.hide.tool.window=Сега можете да видите използването на giveTreat в целия проект и библиотеки. Нека затворим прозореца с инструмента с {0}.
js.editor.navigation.keymap.reference=поздравления\! Стигнахте до края на {0}. Отпечатайте <a href\="{1}">Ръководството за клавишни комбинации</a>, за да имате под ръка всички клавишни комбинации, докато овладеете <ide/>. Щракнете върху бутона по-долу, за да преминете към следващия модул.
js.editor.navigation.recent.files=Нека започнем с навигация в проекта. Щракнете върху {0}, за да се покаже изскачащият прозорец {1}.
js.editor.navigation.search.action=След като вече сме в раздела {0}, нека започнем да въвеждаме {1} в лентата за търсене, за да намерим клавишната комбинация за друга полезна функция за навигация.
js.editor.navigation.search.everywhere=Сега натиснете {0} два пъти, за да откриете друга функция, която ще ви помогне да търсите по-бързо.
js.editor.navigation.search.everywhere.tabs=Това е изскачащият прозорец {0}. Тя ви позволява незабавно да намерите всяко действие, файл, клас или символ и показва всички съвпадения на едно място. Ако искате да извършите по-конкретно търсене, можете да натиснете {1}, за да превключите от {2} към всеки друг раздел, като {3} или {4}. Или можете да използвате клавишната комбинация, за да отворите желания раздел. Нека опитаме последната опция с {5}.
js.editor.navigation.title=Навигация
js.editor.refactoring.replace=Сега заменете и двете срещания с променлива {0}, наречена {1}.
js.editor.refactoring.select.expression=Нека създадем нова променлива {0}, която ще съдържа {1}. Изберете израз {1} от списъка и натиснете {2}.
js.editor.refactorings.next=Току-що научихте два начина за преработване на код в <ide/>. Отпечатайте <a href\="{0}">Справочник за клавишните комбинации</a>, ако предпочитате да използвате клавишни комбинации, или просто продължете да използвате менюто {1}. Щракнете върху бутона по-долу, за да започнете следващия урок, или използвайте {2}.
js.editor.refactorings.rename=С {0} не е нужно да помните всички преработки или техните клавишни комбинации. Щракнете върху {1}, за да видите едно от най-популярните рефакторинги в действие.
js.editor.refactorings.rename.apply=Преименувайте параметър {0} на {1} и натиснете {2}. Това действие ще приложи промените към всички файлове на проекта.
js.editor.refactorings.shortcut=страхотно\! Нека се опитаме да преработим кода с помощта на клавишна комбинация. Поставете курсора върху свойството {0} (ред 4) и натиснете {1}.
js.editor.refactorings.this=<ide/> има <a href\=''{0}''>много преработки</a>, които могат автоматично да преструктурират съществуващ код, без да променят поведението му в целия проект. Нека видим списъка с рефакторинги, налични за параметър {1}. Натиснете {2} или изберете {3} от главното меню.
js.editor.refactorings.title=Рефакторинг кода
js.getting.started.module.description=Научете как да оптимизирате модулното тестване в {0}, като използвате Jest като пример.
js.getting.started.module.name=Първи стъпки с тестването
js.readme.description=Този интерактивен курс ще ви помогне да научите как да изпълнявате обичайни задачи, като преработване на код или навигация в проекти.\n\nКурсът ще бъде най-полезен за тези, които тепърва започват да работят с {0}. Въпреки това, ако сте опитен потребител на {0} и искате да видите дали знаете всички основни клавишни комбинации, ние също ви препоръчваме да преминете през тях.
js.readme.feedback.header=Споделете вашето мнение
js.readme.usage.header=Как да вземете курса
js.testing.jest.coverage.result=По този начин можете бързо да създадете отчет за покритие на кода, показващ колко файла са обхванати от тестовете, включително процента на редовете, които са обхванати в тези файлове. Сега нека затворим отчета за покритие с {0}.
js.testing.jest.end=поздравления\! Стигнахте до края на този модул. Повечето от това, което научихме, се отнася и за други тестови програми, поддържани от <ide/> (с изключение на покритието на кода и режима на гледане). За още съвети и трикове за тестване на приложения с Jest, моля, вижте <a href\="{0}">тази</a> статия в блога. Ако използвате други тестови програми, може да ви е от полза да прегледате нашата <a href\="{1}">уеб помощ</a>.
js.testing.jest.fix.test.1=Ако сега задържите курсора на мишката над {0} в редактора, ще видите изскачащ прозорец, обясняващ защо тестът е неуспешен. От там, ако е необходимо, можете да отстраните грешки в теста.
js.testing.jest.fix.test.2=Сега нека заменим неправилната стойност, използвана за {0}\: На ред 6 заменете {1} с {2}.
js.testing.jest.navigate.1=Сега виждаме кутията с инструменти {0} с резултати от тестове и проследяване на стека за неуспешни тестове от програмата за изпълнение на тестове. Има много други неща, които можете да правите тук, освен просто да проследявате напредъка на теста. Можете да пуснете отново всички ({1}) или само неуспешни ({2}) тестове, да прегледате преминалите тестове ({3}) или да активирате <a href\="{4}">режим на гледане</a> за автоматично повторно пускане на тестове, когато възникнат промени.
js.testing.jest.navigate.2=Можете също бързо да намерите конкретен тест в {0}. Нека опитаме сега\: Поставете курсора някъде в областта {0}, напишете {1} и натиснете {2}, за да отидете на нашия тест.
js.testing.jest.prepare=С <ide/> всички процеси на тестване стават по-лесни. Да видим как. За този модул ще използваме <a href\="{0}">Jest</a> и един от <a href\="{1}">примерните му проекти</a>, така че <strong>уверете се, че имате Jest и npm/Yarn</strong> инсталирани на вашата машина (вижте <a href\="{2}">тази</a> уеб страница за повече информация). Нека започнем със създаване на конфигурация за изпълнение/дебъгване, която е специфична за Jest. От главното меню изберете {3}. След това натиснете {4}, добавете конфигурация {5} с настройки по подразбиране и натиснете {6}, за да я запазите.
js.testing.jest.re.run.test.1=Сега, когато имаме правилната стойност за очаквания резултат, можем да повторим нашия тест. Виждате ли иконата {0} отляво на теста в редактора? Тази икона не само показва състоянието на наскоро изпълнени тестове, но също така ви позволява бързо да стартирате и отстраните грешки в конкретен тест.
js.testing.jest.re.run.test.2=Кликнете върху него и изберете {0}.
js.testing.jest.run=Сега новата конфигурация {0} е избрана по подразбиране. Нека щракнете върху бутона {1} ({2}) до него.
js.testing.jest.success.run.coverage.1=Страхотна работа\! Нашият тест премина успешно.
js.testing.jest.success.run.coverage.2=Нека да разгледаме друг удобен инструмент. Щракнете върху иконата {0}, разположена до менюто за конфигурация за изпълнение/отстраняване на грешки.
js.testing.jest.title=Основи на тестването в {0}
