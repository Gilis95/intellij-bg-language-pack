dpa.notification.InsufficientResourceEtw.text=<html>Максималният брой сесии за влизане в системата е достигнат. Нови регистратори не могат да бъдат създадени, докато сесията за регистриране не бъде спряна. Стойността по подразбиране е 64 на повечето системи. Можете да промените тази стойност, като редактирате ключа EtwMaxLoggers REG_DWORD в HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\WMI. Валидни стойности са от 32 до 256 включително. Необходимо е рестартиране, за да влязат в сила промените.<br>Моля, имайте предвид, че регистраторите използват системни ресурси. Увеличаването на броя регистратори в системата ще намали производителността, ако тези слотове са пълни</html>
