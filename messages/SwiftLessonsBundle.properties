swift.navigation.windows.build.messages=Прозорецът на инструмента <strong>Съобщения за компилиране</strong> показва резултата от компилатора, където можете да филтрирате съобщения за компилиране по тип (вижте бутона <strong>Филтриране на съобщения</strong>({0}) отляво).
