swift.navigation.search.intro=Търсенето на AppCode е различно. Имаме специални функции за търсене на текст и отделни за търсене на код. Това е така, защото кодът не е просто текст, той има определена структура, образувана от кодови структури.
swift.navigation.search.name=Търсене
swift.navigation.search.rule=Има просто правило - идентифицирайте знака, който трябва да намерите, а не част от текста. <strong>Търсене на използване</strong> работи с всяка структура на код в контекста на проект и ще намери всички негови приложения в цялата кодова база.
swift.navigation.search.text.search=Разбира се, понякога може да не знаете какво търсите и да искате да намерите възможно най-много съвпадения чрез текстово търсене. В този случай използвайте {0} за търсене в текущия файл или {1} за търсене в целия проект.
swift.navigation.search.var=В този примерен файл има няколко кодови структури, които съдържат думата {0}. Текстовият курсор е върху променлива, наречена {1}. Натиснете {2}, за да намерите всички текстови съвпадения на {3}.
swift.navigation.todo.activate=Искате ли да знаете колко TODO има във вашия код? <ide/> има специален прозорец с инструменти <strong>TODO</strong>. Натиснете {0}, за да го активирате.
