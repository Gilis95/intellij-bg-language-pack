swift.rdt.test.history=Вградената хронология на тестовете автоматично записва резултатите от последните изпълнения на тестове и също така ги зарежда в прозореца Test Runner. Кликнете върху иконата „{0}“ и изберете елемент от списъка, за да заредите предишния тест.
swift.rdt.test.intro=<ide/> поддържа много рамки за тестване, включително XCTest, Quick, Kiwi, Catch, Boost.Test и Google Test. Нека да разгледаме всички общи функции, налични при тестване на приложение.
swift.rdt.test.intro.tests=<ide/> автоматично определя тестовата зона въз основа на позицията на текстовия курсор. Когато курсорът е някъде в тестов файл, можете да стартирате всички тестове в този файл. Същото важи и за индивидуалните тестове. За да изпълните отделен тест, поставете текстовия курсор в тестовия метод.
swift.rdt.test.more=Това е всичко! За някои рамки (напр. <strong>Quick</strong>), <ide/> предоставя допълнително подобрено представяне на резултатите от теста. За общ преглед на всички тестови рамки, поддържани от <ide/>, гледайте <a href\="https\://www.youtube.com/watch?v\=DXvx6xNG_jc">този видеоклип</a>.
