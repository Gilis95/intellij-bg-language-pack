swift.navigation.windows.project=Изгледът <strong>Проект</strong> е подобен на навигатора на проекта в Xcode. Той показва всички проекти в конкретно работно пространство и всичките им файлове и групи. Щракнете върху ({0}), за да отворите изгледа <strong>Проект</strong>.
swift.navigation.windows.project.settings=Щракнете върху иконата „{0}“ в менюто с опции за изглед на проект и изберете<strong>Дървовиден вид | Xcode Order</strong>за да зададете същия файлов ред като в Xcode (тази опция се активира автоматично, ако сте избрали <ide/> поведение на Xcode).
swift.navigation.windows.project.settings.more=Другите опции включват <strong>Отваряне на файлове с едно кликване</strong> и <strong>Винаги избиране на отворен файл</strong>. Open Files with Single Click автоматично отваря кода на файла, когато го изберете. Винаги избирайте отворен файл автоматично задава фокус върху името на файла като <strong>Проект</strong>, когато областта на редактора има фокус.
swift.navigation.windows.project2=По подразбиране изгледът <strong>Проект</strong> в <ide/> показва файлове и папки в реда, в който са съхранени във файловата система.
swift.navigation.windows.return.to.editor=Натиснете {0}, за да се върнете към прозореца на редактора.
swift.navigation.windows.run=Сега нека изпълним нашия проект в симулатора и погледнем прозореца на инструмента <strong>Изпълни</strong>. Натиснете {0}.
swift.navigation.windows.run.window=Този прозорец на инструмента показва конзолата, където можете да видите изхода на приложението или изхода на <strong>Test Runner</strong>, ако конфигурацията на <strong>Test</strong> работи. Винаги можете да го активирате чрез ({0}).
