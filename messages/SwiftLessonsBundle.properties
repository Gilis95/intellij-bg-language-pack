swift.navigation.windows.structure=Изгледът <strong>Структура</strong> и изскачащият прозорец <strong>Структура</strong> показват структурата на конкретен файл и всички коментари {0}, {1} и {2} или {3} в кода. Те работят подобно на навигатора <strong>Symbol</strong> в Xcode.
