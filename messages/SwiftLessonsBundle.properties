swift.navigation.todo.change.bookmark=Можете да промените името на отметката. Изберете отметка, натиснете {0}, въведете ново име и натиснете {1}.
swift.navigation.todo.custom=Можете да дефинирате свои собствени персонализирани <strong>TODO</strong> филтри. Използвайте {0} →<strong>Редактиране на филтри</strong>, за да отворите диалоговия прозорец TODO Filters и да добавите филтри с помощта на регулярни изрази.
