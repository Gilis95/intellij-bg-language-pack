swift.navigation.windows.breakpoints=Диалоговият прозорец <strong>Точки на прекъсване</strong> работи като навигатора <strong>Точки на прекъсване</strong> в Xcode - показва списък на всички точки на прекъсване в проекта. Използвайте {0}, за да го активирате.
