swift.rdt.test.additional=Можете да сортирате тестове по продължителност ({0}) или по азбучен ред ({1}), като използвате специални икони в прозореца на инструмента <strong>Test Runner</strong>. Натиснете {2}, за да стартирате всички тестове отново и да ги сортирате по продължителност.
swift.rdt.test.debug.single=Сега нека отстраним грешките в теста. Използвайте „{0}“, за да зададете точка на прекъсване на ред и „{1}“, за да отстраните грешки в теста.
