swift.navigation.code.non.project.files=Ако трябва да включите стандартната библиотека и други непроектни файлове, символи или класове, просто натиснете клавишната комбинация два пъти.
swift.navigation.code.recent=И накрая, има две много полезни и често използвани действия за навигация, които ви помагат бързо да превключвате между скорошни файлове и прозорци с инструменти. Първият е изскачащият прозорец <strong>Последни файлове</strong>. Отворете го с {0} и използвайте клавишите със стрелки, за да изберете този, който искате.
swift.navigation.code.super=<strong>Отидете на родителска дефиниция</strong> ще ви отведе до декларацията на родителския клас. Натиснете {0}, за да отидете в клас {1}.
