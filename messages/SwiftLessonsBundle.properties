swift.navigation.windows.init.git=Инициализирайте GIT хранилището чрез {0}→<strong>Създаване на Git хранилище</strong>. Сега активирайте прозореца на инструмента <strong>SKV</strong> с помощта на клавишната комбинация {1}.
swift.navigation.windows.intro=<ide/> има много видове навигация. Знаейки кой тип да се обадите в конкретна ситуация ще ви помогне да използвате WBS по-ефективно.
swift.navigation.windows.jump.to.source=Използвайте клавишите ↑ и ↓, за да изберете произволна структура на кода тук и натиснете {0}, за да преминете към място в кода.
