relaxng.convert-schema.advanced-options.dtd.tooltip.annotation-prefix=Стойностите по подразбиране са представени като префикс на атрибути за анотация\:defaultValue, където префиксът е обвързан с http\://relaxng.org/ns/compatibility/annotations/1.0, както е дефинирано в спецификацията на комитета за съвместимост на RELAX NG DTD. По подразбиране Trang използва 'a' за префикс, освен ако не е в конфликт с префикса, използван в DTD.
relaxng.convert-schema.advanced-options.dtd.tooltip.any-name=Указва името на дефиницията, генерирана за съдържанието на елементите, декларирани в DTD, за да има модел на съдържание ANY.
relaxng.convert-schema.advanced-options.dtd.tooltip.attlist-define=Определя как да се конструира името на дефиниция, представляваща декларация на списък от атрибути от име на елемент. Образецът на името трябва да съдържа точно един знак за процент. Този символ за процент се заменя с името на елемента (след замяна на двоеточието) и резултатът се използва като име на дефиницията.
relaxng.convert-schema.advanced-options.dtd.tooltip.colon-replacement=Символ за заместване на двоеточие в име на елемент при конструиране на имена на дефиниции за представяне на декларации на елементи и списъци с атрибути от DTD. Trang генерира дефиниция за всяка декларация на елемент и списък с атрибути в DTD. Името на дефиницията се основава на името на елемента. В RELAX NG имената на дефинициите не могат да съдържат двоеточие. В DTD обаче имената на елементите могат да съдържат двоеточие. По подразбиране Trang първо се опитва да използва името на елемента без префикс. Ако това предизвика конфликт, двоеточието се заменя с валиден знак за име (първо се пробва с точка).
relaxng.convert-schema.advanced-options.dtd.tooltip.element-define=Определя как да се конструира името на дефиницията, представляваща декларацията на елемент от името на елемента. Образецът на името трябва да съдържа точно един знак за процент. Този символ за процент се заменя с името на елемента (след замяна на двоеточието) и резултатът се използва като име на дефиницията
relaxng.convert-schema.advanced-options.dtd.tooltip.generate-start=Показва дали Trang трябва да генерира начален елемент. DTD не уточнява кои елементи са разрешени като елементи на документ. Trang приема, че всички дефинирани, но никога не споменавани елементи се разрешават като елементи на документа.
relaxng.convert-schema.advanced-options.dtd.tooltip.inline-attlist=Указва да не се генерират дефиниции за декларации на списък с атрибути, а вместо това да се преместят атрибутите, декларирани в декларацията на списъка с атрибути, в дефиницията, генерирана за декларацията на елемента. Това е поведението по подразбиране, когато изходният модул е ​​xsd. В противен случай поведението по подразбиране е същото като при опцията -i no-inline-attlist.
relaxng.convert-schema.advanced-options.dtd.tooltip.strict-any=Запазва точната семантика на ВСЕКИ модел на съдържание чрез изрично избиране на препратки към всички декларирани елементи. По подразбиране Trang използва заместващ знак, който позволява всякакви елементи.
relaxng.convert-schema.advanced-options.xsd.border-title.w3c-xml-schema-output=Изход на W3C XML схема
relaxng.convert-schema.advanced-options.xsd.checkbox.disable-abstract-elements=деактивиране на абстрактни елементи [&D]
