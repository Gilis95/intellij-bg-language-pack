relaxng.convert-schema.advanced-options.xsd.label.any-process-contents=съдържание на произволен процес [&A]
relaxng.convert-schema.advanced-options.xsd.tooltip.any-attribute-process-contents=Указва стойността на атрибута processContents за елементите anyAttribute.\nПо подразбиране е пропускане (съответстващо на семантиката на RELAX NG).
relaxng.convert-schema.advanced-options.xsd.tooltip.any-process-contents=Указва стойността на атрибута processContents за всеки елемент.\nПо подразбиране се пропуска (съответства на семантиката на RELAX NG), освен ако\nформатът на въвеждане не е dtd, в който случай по подразбиране е\nstrict (съответства на семантиката на DTD).
relaxng.convert-schema.advanced-options.xsd.tooltip.disable-abstract-elements=Деактивира абстрактни елементи и заместващи\nгрупи в генерираната XML схема.\nМоже също да се контролира чрез\nатрибути за бележки.
