android.artifact.building.cannot.find.zip.align.error=could.find.zip.align\=Инструментът за zipalign не беше намерен в SDK.\n\nМоля, актуализирайте SDK до най-новата версия и реекспортирайте приложението или изпълнете zipalign ръчно.\n\nПодравняването на приложението ще позволи на Android да използва ресурсите на приложението по-ефективно.
