clion.statement.completion.lesson.intro2=Завършването на изрази работи за завършване на декларации (като класове, пространства от имена и изброявания) и изрази (<code>if/else</code>, <code>while</code>, <code>do</code>, <code>for</code>, <code>switch/case</code>, <code>try/catch</code>).
