readme.conclusion.header=Връщане към проекта
readme.exit.options=За да се върнете към началния екран, просто затворете прозореца на проекта. Можете също да изберете `{0} | {1}` в главното меню. Можете също да използвате менюто „{0}“, за да отваряте или създавате нови проекти. По подразбиране прозорецът на инструмента `{2}` е скрит. Може да се отвори, като изберете `{3} | {4}` в главното меню.
readme.experienced.users.remark=Дори ако урокът ви изглежда познат, опитайте\: може да откриете полезни примери и непознати клавишни комбинации за функции, които активно използвате\!
readme.feedback.request=Ще бъдем благодарни, ако оставите отзив за този курс на обучение\!
readme.ift.description=Този интерактивен курс ще ви запознае с различни работни процеси и случаи на използване на WBS. Той включва много полезни клавишни комбинации. Не е нужно да ги наизустявате всички – опитайте се да приемете най-полезните. Тъй като може да срещнете нови предизвикателства в ежедневната си работа, върнете се към този курс и опитайте други функции. Очаквайте нови уроци, които ще ви помогнат да работите по-ефективно с {0}.
readme.indexing.description=Вероятно четете този `README.md`, докато инициализирате проекта за урок. Обикновено `индексирането` е най-дългата операция при инициализиране на проект. ISR трябва да събере информация за вашата среда, project{0,choice,1\#, libraries|2\#} и да изгради вътрешно представяне. Това е необходимо за бърза навигация и търсене.
readme.navigation.hint=Модулът „{0}“ в този курс ще ви покаже как да използвате това.
readme.shortcuts.header=Управление на клавишни комбинации
readme.shortcuts.problem.description=Някои клавишни комбинации в този курс може да са в конфликт със системните комбинации или клавишни комбинации на други приложения. В този случай можете да кликнете върху проблемната комбинация в текста на урока. Изскачащият прозорец, който се отваря, ще покаже името на действието и алтернативните клавишни комбинации. Ще можете да приложите действие или да зададете нова клавишна комбинация.
readme.start.header=Първи стъпки
readme.toolwindow.description=Прозорецът с инструмента „{0}“ съдържа няколко модула със съответните набори от уроци, които могат да бъдат изпълнени в произволен ред. След завършване на урока той ще бъде маркиран като завършен. Можете да използвате урока, който сте завършили, за справка или да започнете отново, ако искате да освежите знанията си.
