blazor.css.pseudo.element.deep.documentation=CSS псевдоелементът <strong><code>\:\:deep</code></strong> позволява прилагането на изолирани стилове както към дъщерните компоненти, така и към родителския. За подробности вижте <a href\="https\://learn.microsoft.com/ru-ru/aspnet/core/blazor/components/css-isolation?view\=aspnetcore-8.0\#child-component-support">Поддръжка на дъщерен компонент</a>.
