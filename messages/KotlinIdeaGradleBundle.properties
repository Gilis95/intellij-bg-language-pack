notification.notEvaluatedInLastImport.info=<div width\=400><p>За да анализирате този скрипт в WBS, трябва да импортирате проекта Gradle, който го оценява. Опитайте да импортирате повторно асоциирания проект Gradle или да прикачите нов проект Gradle, който оценява този скрипт.</p><p>Можете също да го добавите към самостоятелни скриптове и конфигурацията му ще бъде заредена отделно.</p><p><b>ЗАБЕЛЕЖКА\:</b> Всеки самостоятелен скрипт изисква отделна фаза на конфигуриране на Gradle, за да се изпълнява при надграждане. Това може да изисква много ресурси за големи проекти на Gradle.</p></div>
