notification.gradle.legacy.firstLoad=Проучването на кода е деактивирано, за да се избегне конфигурацията на изграждане на Gradle.
notification.gradle.legacy.firstLoad.info=<div width\=400><p>За да получите конфигурацията на скрипта, трябва да изпълните фазата за конфигуриране на Gradle. Зареждането на конфигурацията на скрипта е деактивирано по подразбиране, тъй като може да изисква много ресурси за големи проекти на Gradle.</p><p>Щракнете върху „Зареждане на конфигурация“, за да оцените скрипта Kotlin DSL Gradle.</p><p>Можете също така да активирате „автоматично презареждане“ за всички скриптове, така че конфигурацията да се зарежда автоматично при първото отваряне на скрипта и да се презарежда всеки път, когато конфигурационните блокове на скрипта за изграждане се променят. Тази опция не се препоръчва за големи проекти на Gradle с дълго време за конфигуриране.</p></div>
notification.gradle.legacy.outsideProject=Проучването на кода не е налично (свързаният проект Gradle не е свързан).
notification.gradle.legacy.outsideProject.addToStandaloneHelp=<div width\=400><p>За да анализирате този скрипт в WBS, трябва да импортирате проекта Gradle, който го оценява. Опитайте да импортирате повторно асоциирания проект Gradle или да прикачите нов проект Gradle, който оценява този скрипт.</p><p>Можете също да го добавите към самостоятелни скриптове и конфигурацията му ще се зареди автоматично.</p><p><b>ЗАБЕЛЕЖКА\:</b> Всеки самостоятелен скрипт изисква отделна фаза на конфигуриране на Gradle, за да се изпълнява при надграждане. Това може да изисква много ресурси за големи проекти на Gradle.</p></div>
notification.gradle.legacy.standalone.info=<div width\=400><p>Проектът Gradle, оценяващ този скрипт, не се импортира в WBS. <br/><p><b>ЗАБЕЛЕЖКА\:</b> Всеки самостоятелен скрипт изисква отделна фаза на конфигуриране на Gradle, която да бъде изпълнена при надграждане. Това може да изисква много ресурси за големи проекти на Gradle.</p></div>
