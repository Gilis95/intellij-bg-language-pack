dirdiff.filter.help.description=<p>За да включите файлове, въведете съответстващ шаблон.</p><p>За да изключите файлове, добавете <code>\!</code> преди шаблона.</p><p>Използвайте <code>\\&</code> и <code>|</code>, за да комбинирате множество филтъра чрез <code>И</code> и <code>ИЛИ</code>, съответно.</p><p><b>Примери</b>\:</p><ul><li><code>*.txt</code> проверява всички пътища, завършващи на .txt.</li><li><code>\!build/*</code> изключва всички файлове в директорията <code>build</code>.</li><li><code>*.txt\\&\!build/*</code> проверява всички пътища, завършващи на <code>.txt</code>, които не са в директорията <code>build</code>.</li></ul>
