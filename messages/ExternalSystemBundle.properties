environment.key.description.link.unlinked.project=Определя дали WBS трябва да импортира информация за проекта от наличните скриптове за компилация.\nФорматът на стойността е едно „всички“ или разделен със запетая списък от елементи като „<Система за компилация>\:[импортиране|пропускане]“.\n- Ако е посочено „всички“, всички открити скриптове за компилация ще бъдат използвани за импортиране\n- Ако е посочено „<Система за компилация>\:import“, скриптовете на тази система за компилация ще се използват за импортиране.\n- Ако '<Build' е указана система>\:skip', скриптовете няма да се използват и известията за тяхното използване няма да се показват в потребителския интерфейс на ISR.\nПримерна стойност на ключ\: "Gradle\:import,Ant\:skip"
