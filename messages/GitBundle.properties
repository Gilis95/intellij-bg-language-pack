warning.message.commit.with.unfinished.rebase=Хранилището на Git по следния път има <b>текущ процес на пребазиране</b>\:<br/>{0}<br/>Може да искате да <b>продължите пребазирането</b> вместо да създавате къмит.<br/>Създаването на къмит по време на пребазиране може да доведе до загуба на къмита.
