type.checker.help=<html><strong>Извън кутията\: </strong> Повече функции, по-отзивчив и по-лек. В сложния код може да възникнат фалшиви грешки.<br><br><strong>Компилаторът\:</strong> е по-точен. Той обаче е по-бавен, консумира повече ресурси и не поддържа функции като сравнение на типове, бърза корекция, проверка и т.н.<br><br>Освен ако не срещате голям брой фалшиви грешки във вашата конкретна кодова база, препоръчваме да използвате вградения инструмент за проверка на типове.</html>
use.compiler.ranges.help=<html><strong>Прилага се за проекти на Scala 3 с маркиране на грешка, зададено за компилатора</strong><br><br>Когато е активирано, текстовите диапазони, докладвани от компилатора на Scala, се използват при маркиране на код в рамките на редактора. Големи текстови диапазони може да бъдат маркирани за избрани грешки при компилиране.<br><br>Когато е деактивирано, малки текстови диапазони може да бъдат маркирани за избрани грешки при компилиране</html>
