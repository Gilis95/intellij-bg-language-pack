libraries.node.text.ide=Библиотеките съдържат класове, които добавят различни функционалности към вашето приложение. Библиотеките също включват изходни файлове и JavaDoc, които помагат при разработването на проекти.<br><br>IntelliJ IDEA използва библиотеки за довършване на код, валидиране, осветяване на грешки и т.н.<br><br>Глобалните библиотеки са налични в целия проект и могат да се използват във всички модули. Те също са налични във всички проекти, създадени локално на вашия компютър.<br><br>Моля, имайте предвид, че глобалните библиотеки не са достъпни за тези, с които споделяте проект. Ако искате да споделите проект с екип, вместо това използвайте библиотеки на проекти.<br><br>Разширете възела и изберете поделементи, за да управлявате глобални библиотеки.<br><br>За да свържете библиотека към модул, изберете модула, щракнете върху раздела Зависимости, щракнете върху Добавяне и посочете местоположението на библиотеката.
libraries.node.text.module=Библиотеките съдържат класове, които добавят различни функционалности към вашето приложение. Библиотеките също включват изходни файлове и JavaDoc, които помагат при разработването на проекти.<br><br>IntelliJ IDEA използва библиотеки за довършване на код, валидиране, осветяване на грешки и т.н.<br><br>Библиотеките на модулите са достъпни само от модулите, към които са свързани. Разгънете възела и изберете поделементи, за да управлявате модулни библиотеки.<br><br>За да свържете библиотека към модул, изберете модула, щракнете върху раздела Зависимости, щракнете върху Добавяне и посочете местоположението на библиотеката.
libraries.node.text.project=Библиотеките съдържат класове, които добавят различни функционалности към вашето приложение. Библиотеките също включват изходни файлове и JavaDoc, които помагат при разработването на проекти.<br><br>IntelliJ IDEA използва библиотеки за попълване на код, валидиране, осветяване на грешки и т.н.<br><br>Библиотеките на проекта са налични в целия проект и могат да се използват във всички модули. Те също са достъпни за всеки, с когото споделяте проекта.<br><br>Разширете възела и изберете поделементи, за да управлявате библиотеки на проекта.<br><br>За да свържете библиотека към модул, изберете модула, щракнете върху раздела Зависимости, щракнете върху Добавяне и посочете местоположението на библиотеката.
