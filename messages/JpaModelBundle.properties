EntityPropertiesPanel.performance.manyToManyCollectionInfo=Когато се използва колекция за съпоставяне на асоциация ManyToMany, Hibernate не може ефективно да премахне асоциацията от таблицата за асоцииране.\nВместо това премахва всички записи, свързани с притежаващия обект, и вмъква отново останалите. Промяната на типа колекция на Set намалява броя на заявките, необходими за изтриване.
EntityPropertiesPanel.performance.manyToManyListInfo=Когато List се използва за съпоставяне на асоциация ManyToMany, Hibernate не може ефективно да премахне такава асоциация от таблицата за присъединяване.
EntityPropertiesPanel.performance.oneToManyJoinColumnInfo=Еднопосочен OneToMany с @JoinColumn може да причини допълнителни заявки.\nТъй като колоната за присъединяване не е в референтния JPA обект и присъства само в DB, ​​Hibernate я актуализира в отделна заявка.\nПреобразуването на асоциацията в двупосочна решава този проблем.
EntityPropertiesPanel.performance.oneToManyJoinTableListInfo=Еднопосочно OneToMany с @JoinTable създава нова таблица, която изисква допълнителни заявки за вмъкване/изтриване и заема място.\nСъщата асоциация може да бъде изразена с помощта на една @JoinColumn.
