db.generated.id.description=<ul><li><b>НЯМА</b> - нито базата данни, нито ORM предоставят ID стойност. Идентификаторът трябва да бъде изрично зададен в изходния код.</li><li><b>ISRNTITY</b> - Идентификаторът се управлява от базата данни. Работи за автоматично увеличаващи се типове и когато използвате `nextval("sequence_name")` или друга функция като стойност по подразбиране за колоната ID.</li><li><b>SEQUENCE</b> - ID се управлява от ORM. Стратегията изисква последователност от страна на базата данни. Оптимизиран за масово вмъкване</li></ul>
db.generated.id.description.uuid=<ul><li><b>НЯМА</b> - нито базата данни, нито ORM предоставят ID стойност. Идентификаторът трябва да бъде изрично зададен в изходния код.</li><li><b>UUID</b> - Идентификаторът се управлява от клиента. Стойността може да бъде присвоена с помощта на генератор на Hibernate, инициализация на полето или персонализирани фабрики. Това е единствената опция за разпределени системи с множество екземпляри на приложения и бази данни, разположени по целия свят.</li></ul>
